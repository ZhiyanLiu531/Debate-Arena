services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
        - /var/run/docker.sock:/tmp/docker.sock:ro
        - certs:/etc/nginx/certs
        - vhost-d:/etc/nginx/vhost.d
        - html:/usr/share/nginx/html
        - acme:/etc/acme.sh
    networks:
      - proxy

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - "nginx-proxy"
    volumes_from:
       - "nginx-proxy"
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - certs:/etc/nginx/certs
        - acme:/etc/acme.sh
    environment:
        - DEFAULT_EMAIL=your-email@example.com
    networks:
      - proxy

  frontend:
    build: frontend
    image: debate-court-frontend:latest
    container_name: frontend
    restart: unless-stopped
    expose:
        - "80"
    networks:
      - proxy
      - internal
    environment:
      - VIRTUAL_HOST=debate.example.com
      - LETSENCRYPT_HOST=debate.example.com
      - VIRTUAL_PORT=80

  backend:
    build: backend
    image: debate-court-backend:latest
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=debate.example.com
      - VIRTUAL_PATH=/api/
      - VIRTUAL_PORT=3000
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: debate_court
    volumes:
      - mongodata:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge

volumes:
  certs:
  vhost-d:
  html:
  acme:
  mongodata: